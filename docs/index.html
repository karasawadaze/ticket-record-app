<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ライブ記録 サポート</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #a78b55;
      --bg: #f8f6f0;
      --text: #1f1f1f;
      --muted: #666;
      --panel: #fff;
      --border: #e5ded0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --text: #f5f0e8;
        --muted: #b8b0a4;
        --panel: #1a1a1a;
        --border: #34302a;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      line-height: 1.75;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 7vw, 52px);
      letter-spacing: 0;
    }
    p {
      color: var(--muted);
    }
    nav {
      display: grid;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .arrow {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>ライブ記録</h1>
    <p>ライブ参加の思い出を、チケット画像・公演情報・評価と一緒に残すためのアプリです。</p>
    <nav aria-label="サポートページ">
      <a class="link-card" href="./terms.html">
        <span>利用規約</span>
        <span class="arrow">→</span>
      </a>
      <a class="link-card" href="./privacy.html">
        <span>プライバシーポリシー</span>
        <span class="arrow">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
